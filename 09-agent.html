<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09 · one agent</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/fonts.css">
<style>
  /* One agent, nothing else: a single boxy machine with its light breathing.
     Belongs to the Setup slide "An agent is an AI like ChatGPT, in a loop,
     with tools." The deck overlays that heading in the top ~220px, so the
     robot sits in the lower two thirds. One beat; the slide is otherwise
     ordinary. */
  .robot { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="robot" id="robot"></div>
</div>
<script src="shared/robot.js"></script>
<script src="shared/scene.js"></script>
<script>
(function () {
  'use strict';
  Scene.fitStage(document.getElementById('stage'));
  var fig = Robot.Figure.create(document.getElementById('robot'), { size: 420, state: 'active', antenna: true, seed: 3 });
  Scene.create({ name: 'agent', beats: 1, goTo: function () {} });
  window.fig = fig;
})();
</script>
</body>
</html>
