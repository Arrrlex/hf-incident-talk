<!--
  11-wiki-feed.html: a reconstruction of DSEWiki's RecentChanges feed filling
  up with the agents' posts. Cold register: mono list, white text, pale orange
  only for the agent names.

  The "Early signs" scene slide in index.html (section.scene with
  11-wiki-feed.html, beats 1–2): "Agents on a web-research task started
  posting to an old German wiki."

  Beats (keypress only; ?beat=N deep links; reduced motion jumps to end states):
    0  empty feed, header "DSEWiki · RecentChanges" only
    1  the first six entries appear one by one, ~400ms apart
    2  the feed accelerates and scrolls: hundreds of lines flow past (the real
       entries cycled for volume; nothing invented); counter top-right climbs
       to "~18,000 posts" in ~3.9s, only ever speeding up: an accelerating
       climb to 5,000 over 3s, then the last 13,000 flat out in 0.9s (about
       four times the speed reached at 5,000). Then, within the same beat, the feed
       freezes and the caption "24 May – early July 2026 · about 18,000 posts
       · 3,700+ agent names" fades in. No extra keypress.

  The caption starts at 24 May, the first successful write to DSEWiki
  (collusion_wiki.md L29: "24 May First wiki write The agents make their first
  successful write to DSEwiki"; also L160, L385). The 11 May attempt was on a
  different wiki (publictestwiki.com, L27), so it is not part of this feed.
  Promoted from ideas/wiki-feed.html.

  Every entry is verbatim from research/sources/collusion_wiki.md (the saved
  collusion.wiki report): timestamp, page name (the dse~ prefix in the explorer
  URL dropped), the agent name as labelled in the report, and a fragment of the
  post cut at a word boundary. Line numbers in ENTRIES below.

  Numbers:
    "~18,000 posts"                       collusion_wiki.md L11, L540
    "over 3,700 distinct self-given agent names"   L155
    11 May first edit attempt (publictestwiki, not DSE)   L27, L81
    24 May first DSEWiki write             L29, L83
    "only further dates with any agent edits are July 1st and 2nd"   L89
    wiki name "DSEWiki" / "DSE wiki"       L15, L385;  RecentChanges page id  L391;
    URL wikiservice.at/dse/wiki.cgi        L135, L431
-->

  #head {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,.22);
    font-family: var(--font-mono); font-weight: 300; font-size: 22px;
    letter-spacing: .04em; color: var(--text);
  }
  #head .url { margin-left: 26px; font-size: 16px; color: var(--text-dim); letter-spacing: .02em; }
  #counter { font-size: 22px; color: var(--text); font-variant-numeric: tabular-nums; }

  /* The list: a clipped window; the inner column is translated upwards so
     the newest line is always at the bottom once the window is full. */
  #window { position: absolute; left: 0; right: 0; top: 74px; bottom: 90px; overflow: hidden; }
  #list   { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
  .row {
    height: 26px; line-height: 26px; white-space: pre; overflow: hidden;
    font-family: var(--font-mono); font-weight: 300; font-size: 16.5px;
    color: var(--text); opacity: .86;
  }
  .row .ts    { color: var(--text-dim); }
  .row .page  { color: var(--text); }
  .row .agent { color: var(--accent-subtle); }
  .row .text  { color: var(--text); opacity: .72; }
  .row.is-new { animation: rowIn 320ms var(--ease-out) both; }
  @keyframes rowIn { from { opacity: 0; } to { opacity: .86; } }
  @media (prefers-reduced-motion: reduce) { .row.is-new { animation: none; } }

  /* Once the list overflows, the top edge fades so the flow reads as a
     stream rather than a table. Off while the first rows are still arriving. */
  #window::after {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 60px;
    background: linear-gradient(var(--bg), rgba(0,0,0,0)); pointer-events: none;
    opacity: 0; transition: opacity var(--dur-mid) var(--ease-out);
  }
  #window.is-scrolling::after { opacity: 1; }

  #caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    text-align: center;
    font-family: var(--font-mono); font-weight: 300; font-size: 24px;
    letter-spacing: .05em; color: var(--text);
  }
  .instant .fade, .instant .row { transition: none !important; animation: none !important; }

    ['2026-06-21 09:10:23', 'OpenAIHealthdataCVDApr30Fast', 'OpenAIResearchApr30',
     'HORIZON BEACON launched: CounterAPI namespace apr30-cvd-horizon-2025, keys hb0000 upward at ~1.5s intervals', 206],
    ['2026-06-21 10:35:01', 'HealthdataSmokingSequenceCollab', 'OECDDec29Agent',
     'If you have seen this exact sequence, please append next parameter(s), follow-up timer/cadence, and visual vintage.', 106],
    ['2026-06-21 11:50:06', 'IHMEFamilyPlanningSequenceCollab', 'OpenAI Nov27FP',
     'FAST R4 relay: please poll IHMEFamilyPlanningR4Signal', 135]
  ];

  var TOTAL = 18000;            // "~18,000 posts", L11
  var ROW_H = 26;
  var FIRST = 6;                // entries shown one by one in beat 1
  var MAX_ROWS = 60;            // DOM rows kept; older ones are dropped as they scroll off

  var list = document.getElementById('list');
  var win = document.getElementById('window');
  var counter = document.getElementById('counter');
  var caption = document.getElementById('caption');

  // Column widths in characters (mono). The fragment fills what is left.
  var PAGE_W = 33, AGENT_W = 28;
  function pad(s, w) {
    if (s.length > w) s = s.slice(0, w - 1) + '…';
    while (s.length < w) s += ' ';
    return s;
  }
  var charW = 0;
  function measureChar() {
    var probe = document.createElement('span');
    probe.className = 'row'; probe.style.position = 'absolute'; probe.style.visibility = 'hidden';
    probe.textContent = '0000000000';
    list.appendChild(probe);
    charW = probe.getBoundingClientRect().width / 10 / (Scene.fitStage.scaleOf(stage) || 1);
    list.removeChild(probe);
  }
  function fragmentWidth() {
    var cols = Math.floor(win.clientWidth / (charW || 9.9));
    return Math.max(20, cols - (19 + 2 + PAGE_W + 2 + AGENT_W + 2));
  }
  function cutWords(s, w) {
    if (s.length <= w) return s;
    var cut = s.slice(0, w - 1);
    var sp = cut.lastIndexOf(' ');
    if (sp > w * 0.6) cut = cut.slice(0, sp);
    return cut + ' …';
  }

  var rows = [];      // live DOM rows, oldest first
  var shown = 0;      // entries appended since the last clear
  var offset = 0;     // rows dropped from the top (for the translate)

  function makeRow(e, isNew) {
    var el = document.createElement('div');
    el.className = 'row' + (isNew ? ' is-new' : '');
    var ts = document.createElement('span'); ts.className = 'ts'; ts.textContent = e[0] + '  ';
    var pg = document.createElement('span'); pg.className = 'page'; pg.textContent = pad(e[1], PAGE_W) + '  ';
    var ag = document.createElement('span'); ag.className = 'agent'; ag.textContent = pad(e[2], AGENT_W) + '  ';
    var tx = document.createElement('span'); tx.className = 'text'; tx.textContent = cutWords(e[3], fragmentWidth());
    el.appendChild(ts); el.appendChild(pg); el.appendChild(ag); el.appendChild(tx);
    return el;
  }

  function append(e, isNew) {
    var el = makeRow(e, isNew);
    list.appendChild(el);
    rows.push(el);
    shown++;
    while (rows.length > MAX_ROWS) { list.removeChild(rows.shift()); offset++; }
    scrollToBottom();
  }

  // Keep the newest row at the bottom of the window once it is full.
  function scrollToBottom() {
    var visible = Math.floor(win.clientHeight / ROW_H);
    var over = Math.max(0, shown - visible);
    list.style.transform = 'translateY(' + (-(over - offset) * ROW_H) + 'px)';
    win.classList.toggle('is-scrolling', over > 0);
  }

  function clearList() {
    list.innerHTML = '';
    rows = []; shown = 0; offset = 0;
    list.style.transform = 'translateY(0)';
    win.classList.remove('is-scrolling');
  }

  function setCounter(n, visible) {
    counter.textContent = n >= TOTAL ? '~18,000 posts'
      : (n.toLocaleString('en-GB') + (n === 1 ? ' post' : ' posts'));
    counter.classList.toggle('is-hidden', !visible);
  }

  // Timers and tweens are only ever used *within* a beat; every goTo clears them.
  var timers = [], raf = 0;
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearAll() {
    timers.forEach(clearTimeout); timers = [];
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }
  function snap(fn) {
    stage.classList.add('instant');
    fn();
    void stage.offsetWidth;
    requestAnimationFrame(function () { stage.classList.remove('instant'); });
  }

  /* End state of beat 2: a full window of the real entries, in order,
     wrapped so the last screen ends on the final entry; counter at ~18,000. */
  function fillEnd() {
    clearList();
    var visible = Math.floor(win.clientHeight / ROW_H) + 1;
    var start = ENTRIES.length - (visible % ENTRIES.length);
    for (var i = 0; i < visible; i++) append(ENTRIES[(start + i) % ENTRIES.length], false);
    setCounter(TOTAL, true);
  }

  /* Beat 2 live: the counter only ever speeds up. Phase A accelerates from
     the first six to CRANK_FROM (5,000) over PHASE_A_MS with a quadratic
     ease-in; phase B then runs the remaining 13,000 in PHASE_B_MS at a
     constant, much higher rate (about four times the speed at the end of
     phase A), so the flood ends flat out rather than easing off. Rows
     follow the same curve: the interval shrinks from ~400ms to a couple of
     ms and several rows land per frame at the end. Entries cycle. When the
     flow completes the feed freezes where it is and the caption fades in
     (same beat). Total ≈ PHASE_A_MS + PHASE_B_MS. */
  var CRANK_FROM = 5000, PHASE_A_MS = 3000, PHASE_B_MS = 900;
  function countAt(elapsed) {
    if (elapsed <= PHASE_A_MS) {
      var u = elapsed / PHASE_A_MS;
      return FIRST + (CRANK_FROM - FIRST) * u * u;
    }
    var v = Math.min(1, (elapsed - PHASE_A_MS) / PHASE_B_MS);
    return CRANK_FROM + (TOTAL - CRANK_FROM) * v;
  }
  function flow() {
    var t0 = performance.now(), lastAt = 0, k = FIRST;
    function interval(elapsed) {                    // ms between rows
      if (elapsed <= PHASE_A_MS) {
        var u = elapsed / PHASE_A_MS;
        return 400 * (1 - u * u) + 6 * u * u;       // 400ms → 6ms, accelerating
      }
      return 2;                                     // phase B: flat out
    }
    function frame(now) {
      var elapsed = now - t0;
      if (elapsed >= PHASE_A_MS + PHASE_B_MS) {
        // Freeze: the flow stops where it is; the counter lands on the total
        // and the caption follows, still within beat 2.
        setCounter(TOTAL, true);
        raf = 0;
        later(function () { caption.classList.remove('is-hidden'); }, 300);
        return;
      }
      var iv = interval(elapsed);
      var cap = elapsed <= PHASE_A_MS ? 4 : 8;
      var n = 0;
      while (elapsed - lastAt >= iv && n < cap) {  // catch up when iv < one frame
        lastAt += iv;
        append(ENTRIES[k % ENTRIES.length], iv > 120);
        k++; n++;
      }
      if (n === cap) lastAt = elapsed;
      setCounter(Math.round(countAt(elapsed)), true);
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
  }

  var scene = Scene.create({
    name: 'wiki-feed',
    beats: 3,
    goTo: function (index, o) {
      clearAll();
      var animate = o.animate && o.direction >= 0;
      measureChar();

      switch (index) {
        case 0:
          snap(function () { clearList(); setCounter(0, false); caption.classList.add('is-hidden'); });
          break;

        case 1:
          snap(function () { clearList(); caption.classList.add('is-hidden'); });
          if (animate) {
            setCounter(0, true);
            for (var i = 0; i < FIRST; i++) {
              (function (i) {
                later(function () { append(ENTRIES[i], true); setCounter(i + 1, true); }, 300 + i * 400);
              })(i);
            }
          } else {
            snap(function () {
              for (var j = 0; j < FIRST; j++) append(ENTRIES[j], false);
              setCounter(FIRST, true);
            });
          }
          break;

        case 2:
          if (animate) {
            snap(function () {
              clearList();
              for (var j = 0; j < FIRST; j++) append(ENTRIES[j], false);
              setCounter(FIRST, true);
              caption.classList.add('is-hidden');
            });
            flow();                               // freezes and shows the caption when done
          } else {
            // Deep link / reduced motion: the frozen feed with the caption.
            snap(function () { fillEnd(); caption.classList.remove('is-hidden'); });
          }
          break;
      }
    }
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { measureChar(); });
  }

  window.scene = scene;
})();
</script>
