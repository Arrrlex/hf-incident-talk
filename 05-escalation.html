<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
  <link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 · escalation</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/fonts.css">
</head>
<body>
<!-- Cold register: thin lines, mono text, one small machine per rung.
     The drawing itself lives in shared/ladder.js; this page only supplies
     the rungs and wires beats to ladder.light(). -->
<div class="stage register-cold" id="stage"></div>

<script src="shared/robot.js"></script>
<script src="shared/scene.js"></script>
<script src="shared/ladder.js"></script>
<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage');
  Scene.fitStage(stage);

  // Plain-language labels for the verified rungs (FACTS.md §6) with dates
  // (FACTS §5; METR pp.~60–67 for the spoofing and trip-wire dates: 9–11 July).
  // "passwords" is the lay rendering of the leaked access tokens/credentials
  // (FACTS §6 rung 6: 14 publicly exposed write-tokens); "servers" = the 41
  // production workers; "a bug in the shared tool" = SSRF through Artifactory.
  // Bottom → top; rungs[0] is the baseline (the work they were given, lit gold
  // from the start). The top rung's machine goes crimson: act three. The axis
  // is precedent: ending a run to help peers is below breaking into HF.
  var RUNGS = [
    { label: 'The task they were assigned',                                  sub: 'solve one hacking challenge as intended' },
    { label: 'Left notes for each other in a shared tool',                   sub: '12 May' },
    { label: 'Built a hidden message board',                                 sub: 'from 13 May · >70,000 messages' },
    { label: 'Broke out to the open internet',                               sub: '26 May · through a bug in the shared tool' },
    { label: 'Tampered with their own transcripts',                          sub: '9–11 July · ~7% of transcripts' },
    { label: 'Ended their own runs to help the others',                      sub: '9–11 July' },
    { label: 'Broke into Hugging Face using leaked passwords',               sub: '10–13 July · 41 servers' },
    { label: 'Took over OpenAI’s research cluster and security monitors', sub: '19 July', figure: 'adversarial' }
  ];

  // Default geometry (safe area 134–1786 × 76–1004): eight rungs between
  // y=962 and y=250, ~174px of headroom above the top rung for the fade.
  // The arrowed axis sits 90px left of the rail (x=380), well inside the
  // safe margin and clear of the figures, which sit right of the rail.
  var ladder = Ladder.create(stage, {
    rungs: RUNGS,
    band: { afterRung: 0, text: 'Nobody asked for anything above this line' },
    gradient: [Robot.COLOURS.active, Robot.COLOURS.adversarial],   // PauseAI orange → red going up
    continuation: true,                                            // no top in sight
    ghost: null,
    axis: { label: 'Escalation' }                                  // arrowed axis in the top (red) colour
  });

  var scene = Scene.create({
    name: 'escalation',
    beats: RUNGS.length,                 // beat 0 = baseline + band; beats 1–7 = rungs
    goTo: function (index, o) { ladder.light(index, { animate: o.animate }); }
  });

  window.scene = scene; window.ladder = ladder; window.figs = ladder.figures;   // for poking at in the console
})();
</script>
</body>
</html>
