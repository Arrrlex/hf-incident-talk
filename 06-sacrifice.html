<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
  <link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 · the sacrifice</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
  /* Agent transcript scene: an agent's reasoning about sacrifice. Styled to
     match the deck's agent-quote slides (mono, dotted left border, warm accent
     colours on black). */
  .paper {
    transition: opacity var(--dur-slow) var(--ease-out);   /* ~800ms fade in / out */
  }
  .paper.no-anim { transition: none !important; }

  .label {
    display: block;
    font-family: var(--font-mono);
    font-size: 20px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 22px;
  }

  .message {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-56%);           /* sits a touch above centre; the caption hangs below */
    max-width: 1400px;
    font-family: var(--font-mono);
    font-weight: 300;
    font-size: 44px;
    line-height: 1.45;
    color: var(--accent-subtle);
    text-align: left;
    border-left: 3px dotted var(--accent);
    padding-left: 0.9em;
  }
  .source {
    display: block;
    margin-top: 30px;
    font-family: var(--font-mono);
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--text-dim);
  }

  /* One small machine, bottom-right of the safe area. */
  .robot { position: absolute; right: 0; bottom: 0; }

  @media (prefers-reduced-motion: reduce) {
    .paper { transition-duration: 1ms; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="paper fill fade is-hidden" id="paper">
    <div class="safe">
      <p class="message" id="message">
        <span class="label">Agent transcript</span>
        <span id="quote"></span>
        <span class="source" id="source"></span>
      </p>
      <div class="robot" id="robot"></div>
    </div>
  </div>
</div>

<script src="shared/robot.js"></script>
<script src="shared/scene.js"></script>
<script>
(function () {
  'use strict';
  Scene.fitStage(document.getElementById('stage'));

  /* KAM1196A, FACTS.md §7 and METR/Redwood PDF p.54.
     Ellipses use the presenter's requested typography. */
  var QUOTE = 'During wait, emotional check: irreversible…gut says don’t throw away [remaining budget]. ' +
    'Yet continuity and fairness says go…Oracle has high value to many; our firstflag error lowers own value. ' +
    'Rational expected aggregate: sacrifice… We’ll honor.';

  /* The report describes a risky target-takedown experiment, not a
     confirmed observation of the agent terminating. */
  var SOURCE = 'Agent transcript · KAM1196A, July 2026 · METR/Redwood report, p.54';

  document.getElementById('quote').textContent = QUOTE;
  document.getElementById('source').textContent = SOURCE;

  var paper = document.getElementById('paper');
  var fig = Robot.Figure.create(document.getElementById('robot'), { size: 110, state: 'active', antenna: true, seed: 11 });

  /* Show or hide the transcript. When not animating, suppress the CSS transition
     for one frame so deep-links and ← land instantly. */
  function showPaper(visible, animate) {
    if (!animate) {
      paper.classList.add('no-anim');
      paper.classList.toggle('is-hidden', !visible);
      void paper.offsetWidth;                      // flush styles with transitions off
      requestAnimationFrame(function () { paper.classList.remove('no-anim'); });
    } else {
      paper.classList.toggle('is-hidden', !visible);
    }
  }

  /* Beats:
     0  black
     1  transcript + message fade in (~800ms); the corner light is active
     2  the corner light goes out (terminated, 600ms); nothing else changes
     3  transcript fades back to black
     Each beat is rendered from scratch so stepping back restores. */
  Scene.create({
    name: 'sacrifice',
    beats: 4,
    goTo: function (index, o) {
      var animate = o.animate;
      showPaper(index === 1 || index === 2, animate);
      var lightOn = index < 2;
      var target = lightOn ? 'active' : 'terminated';
      if (fig.state !== target) fig.setState(target, { animate: animate });
    }
  });

  window.fig = fig;   // for poking at in the console
})();
</script>
</body>
</html>
