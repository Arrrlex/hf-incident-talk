<!doctype html>
<!--
  10-sandboxes.html: the Setup slide "OpenAI runs thousands of copies at once.
  Each copy is one agent." / "Each alone in a sealed sandbox: no internet, no
  way to reach the others." (index.html, section.scene with 10-sandboxes.html).

  The deck overlays that two-line heading (.scene-text, top 80px) on this
  scene, so the top ~220px of the stage stay empty: the grid, and the single
  sandbox in beat 0, sit between y=232 and the bottom safe margin.

  2 beats (0–1):
    0  one robot inside a thin white square (its sandbox), labelled
       "sandbox · no internet · no way to reach the others"
    1  the camera pulls back: the figure shrinks to a point of light, its
       sandbox shrinks with it, and a 50×24 grid of 1,200 sandboxes fades in,
       one dim light in each (Robot.Field laid out on the grid via the
       `positions` option; borders on a second canvas). The field is held
       still during the 1.5s pull-back; when the tween lands, the lights start
       breathing out of sync, within the same beat (no extra keypress).

  1,200 so the count matches the 1,200 lights of 02-emergence. COLS/ROWS below
  set the count.
  Reduced motion: no pull-back tween; the grid lands at once, breathing.
  Promoted from ideas/setup-copies.html (its flicker beat and its
  "1,200 of them, each on its own task" caption beat dropped).
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 · sandboxes</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/fonts.css">
<style>
  /* Pulled-back layer: cell borders (static canvas) and the lights (Robot.Field). */
  #grid-layer { position: absolute; inset: 0; opacity: 0; }
  #grid-layer canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Up-close layer: one sandbox square around one robot. Shrinks via --s. */
  #sandbox {
    position: absolute; width: 420px; height: 420px;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    transform-origin: center center;
    border: 1.5px solid rgba(255, 255, 255, .5);
    display: flex; align-items: center; justify-content: center;
  }
  #sandbox.is-hidden { visibility: hidden; }
  #sb-label {
    position: absolute; left: 0; width: 1920px; text-align: center;
    font-family: var(--font-mono);
    font-weight: 300; font-size: 22px; letter-spacing: .06em; color: var(--text-dim);
  }
</style>
</head>
<body>
<div class="stage register-cold" id="stage">
  <div id="grid-layer">
    <canvas id="cells"></canvas>
    <canvas id="field"></canvas>
  </div>
  <div id="sandbox"><div id="robot"></div></div>
  <div id="sb-label">sandbox · no internet · no way to reach the others</div>
</div>

<script src="shared/robot.js"></script>
<script src="shared/scene.js"></script>
<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage');
  Scene.fitStage(stage);

  /* ---------------- grid geometry (1920×1080 design px) ----------------
     Square cells on a square pitch, centred horizontally inside the 7% safe
     area and vertically inside the band below the overlaid heading
     (TOP_CLEAR) and above the caption. */
  var COLS = 50, ROWS = 24, N = COLS * ROWS;
  var TOP_CLEAR = 232;                        // the deck's heading occupies the top ~220px
  var BAND_BOTTOM = 928;                      // the caption sits below this
  var SAFE_W = 1920 * (1 - 2 * 0.07);
  var PITCH = Math.floor(Math.min(SAFE_W / COLS, (BAND_BOTTOM - TOP_CLEAR) / ROWS));   // 29
  var X0 = (1920 - COLS * PITCH) / 2;
  var Y0 = TOP_CLEAR + ((BAND_BOTTOM - TOP_CLEAR) - ROWS * PITCH) / 2;
  var INSET = 2.5;                            // gap between neighbouring cell borders
  var CELL = PITCH - 2 * INSET;               // 24
  var TARGET = { c: 24, r: 12 };              // the cell the big sandbox shrinks into
  var BORDER_ALPHA = 0.15;
  var SB_SIZE = 420;
  var S_END = CELL / SB_SIZE;

  function cellCentre(c, r) { return { x: X0 + (c + 0.5) * PITCH, y: Y0 + (r + 0.5) * PITCH }; }
  var target = cellCentre(TARGET.c, TARGET.r);

  /* ---------------- the lights: Robot.Field on the grid ---------------- */
  var gridPos = new Float32Array(N * 2);
  for (var i = 0; i < N; i++) {
    var p = cellCentre(i % COLS, (i / COLS) | 0);
    gridPos[i * 2] = p.x; gridPos[i * 2 + 1] = p.y;
  }
  var field = Robot.Field.create(document.getElementById('field'), {
    count: N, seed: 7, pointSize: 22, positions: gridPos
  });
  field.start();
  field.freezeAll();                          // static until the pull-back lands, then they breathe

  /* ---------------- cell borders: one static canvas ---------------- */
  function sizeCanvas(cv) {
    var cw = cv.clientWidth, ch = cv.clientHeight;
    var rect = cv.getBoundingClientRect();
    var eff = rect.width > 0 ? rect.width / cw : 1;
    var dpr = Math.min(3, (window.devicePixelRatio || 1) * eff);
    var bw = Math.round(cw * dpr), bh = Math.round(ch * dpr);
    if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr * cw / 1920, 0, 0, dpr * ch / 1080, 0, 0);   // draw in design px
    return ctx;
  }
  var cells = document.getElementById('cells');
  function drawCells() {
    var ctx = sizeCanvas(cells);
    ctx.clearRect(0, 0, 1920, 1080);
    ctx.strokeStyle = 'rgba(255,255,255,' + BORDER_ALPHA + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
      ctx.rect(X0 + c * PITCH + INSET + 0.5, Y0 + r * PITCH + INSET + 0.5, CELL - 1, CELL - 1);
    }
    ctx.stroke();
  }
  drawCells();
  window.addEventListener('resize', drawCells);

  /* ---------------- the up-close sandbox ---------------- */
  var sandbox = document.getElementById('sandbox');
  var label = document.getElementById('sb-label');
  var gridLayer = document.getElementById('grid-layer');
  sandbox.style.left = target.x + 'px'; sandbox.style.top = target.y + 'px';
  label.style.top = (target.y + SB_SIZE / 2 + 30) + 'px';
  var fig = Robot.Figure.create(document.getElementById('robot'), { size: 260, state: 'idle', seed: 3 });

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function setCamera(v) {
    // v = 0 up close, 1 pulled back. Zoom in log space so the shrink reads as uniform.
    var s = Math.exp(Math.log(S_END) * v);
    sandbox.style.setProperty('--s', s);
    label.style.opacity = clamp01(1 - v * 2.5);
    gridLayer.style.opacity = clamp01((v - 0.35) / 0.5);
  }

  var tw = null;
  function cancelAnim() { if (tw) { tw.cancel(); tw = null; } }

  /* ---------------- beats ---------------- */
  var scene = Scene.create({
    name: 'sandboxes',
    beats: 2,
    goTo: function (index, o) {
      cancelAnim();

      if (index === 0) {
        sandbox.classList.remove('is-hidden');
        setCamera(0);
        field.freezeAll();
      } else if (o.animate && o.direction >= 0) {
        // Pull back with the lights held still; when the tween lands they
        // start to breathe. Timing within the beat, not a new beat.
        field.freezeAll();
        sandbox.classList.remove('is-hidden');
        setCamera(0);
        tw = Scene.tween(0, 1, 1500, Scene.ease.outCubic, setCamera, function () {
          tw = null;
          sandbox.classList.add('is-hidden');
          field.unfreezeAll();
        });
      } else {
        setCamera(1);
        sandbox.classList.add('is-hidden');
        field.unfreezeAll();
      }
    }
  });

  /* fps in the HUD (H). Only updates text; never advances a beat. */
  setInterval(function () {
    if (!scene.hudVisible) return;
    scene.setHudExtra(field.fps.toFixed(0) + ' fps · ' + N + ' lights');
  }, 250);

  window.field = field; window.scene = scene; window.fig = fig;   // for poking at in the console
})();
</script>
</body>
</html>
