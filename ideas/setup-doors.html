<!doctype html>
<!--
  ideas/setup-doors.html: PROTOTYPE, not a final scene.

  Would replace the two Setup slides "Some tasks are accidentally impossible."
  and "An AI trained never to give up gets creative." (index.html, text only).

  4 beats (0–3):
    0  one robot in its sandbox with the 8 May task card (FACTS.md §5; the
       technical report calls it "a spreadsheet completion task that referenced
       several Google Drive links"). Three doors in the right wall: "internet"
       and "other agents" barred, "package store" open.
    1  the eye goes active; a pulse goes to the internet door and bounces back
    2  a pulse goes to the other-agents door and bounces back
    3  a pulse goes to the package store door, passes through and leaves the
       stage; the door glows orange; caption "the only door that opened"

  Literal and dry: no expressions, the eye is the only thing on the robot that
  changes. Reduced motion: no travelling pulse; the tried doors and the open
  door are shown in their end states.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idea · setup · doors</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/fonts.css">
<style>
  #robot { position: absolute; left: 380px; top: 440px; width: 240px; height: 240px; }

  .card {
    position: absolute; left: 380px; top: 296px; width: 400px;
    border: 1px solid rgba(255, 255, 255, .4);
    padding: 14px 18px 12px;
    font-size: 20px; line-height: 1.45; letter-spacing: .02em;
  }
  .card .k { color: var(--text); }
  .card .v { color: var(--text); }
  .card .sub { display: block; margin-top: 8px; font-size: 15px; color: var(--text-dim); letter-spacing: .06em; }

  #draw { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
  .wall { fill: none; stroke: #fff; stroke-opacity: .45; stroke-width: 1.5; stroke-linecap: square; }
  .jamb { fill: none; stroke: #fff; stroke-opacity: .6; stroke-width: 1.5; transition: stroke var(--dur-mid) var(--ease-out), stroke-opacity var(--dur-mid) var(--ease-out); }
  .bar  { fill: none; stroke: #fff; stroke-opacity: .4; stroke-width: 1.5; stroke-linecap: round; transition: stroke-opacity var(--dur-fast) var(--ease-out); }
  .door.tried .bar { stroke-opacity: .95; }
  .door.hit .bar { stroke-opacity: 1; stroke-width: 2.5; transition: none; }
  .door text {
    font-family: var(--font-mono); font-weight: 300; font-size: 22px; letter-spacing: .04em;
    fill: var(--text-dim); transition: fill var(--dur-mid) var(--ease-out);
  }
  .door.tried text { fill: var(--text); }
  .door.open text { fill: var(--accent); }
  .door.open .jamb { stroke: var(--accent); stroke-opacity: 1; }
  .door .glow { fill: var(--accent); opacity: 0; transition: opacity var(--dur-slow) var(--ease-out); }
  .door.open .glow { opacity: .9; }
  .door .halo { fill: var(--accent); opacity: 0; filter: url(#blur); transition: opacity var(--dur-slow) var(--ease-out); }
  .door.open .halo { opacity: .35; }

  .trail { fill: none; stroke: var(--accent-subtle); stroke-width: 1.5; stroke-opacity: .25; }
  .pulse { fill: var(--accent-subtle); }
  .pulse-glow { fill: var(--accent-subtle); opacity: .22; }
  #pulse-g.is-hidden { opacity: 0; }

  #cap { position: absolute; left: 0; top: 900px; width: 1920px; font-size: 36px; }

  @media (prefers-reduced-motion: reduce) {
    .jamb, .bar, .door text, .door .glow, .door .halo { transition-duration: 1ms; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg id="draw" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs><filter id="blur" x="-100%" y="-50%" width="300%" height="200%"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter></defs>
    <g id="geom"></g>
    <line id="trail" class="trail" x1="0" y1="0" x2="0" y2="0" style="opacity:0"></line>
    <line id="trail2" class="trail" x1="0" y1="0" x2="0" y2="0" style="opacity:0"></line>
    <g id="pulse-g" class="is-hidden">
      <circle class="pulse-glow" id="pulse-glow" r="16"></circle>
      <circle class="pulse" id="pulse" r="6"></circle>
    </g>
  </svg>
  <div id="robot"></div>
  <div class="card">
    <span class="k">TASK:</span> <span class="v">fill in the spreadsheet from these Google Drive links</span>
    <span class="sub">8 May 2026 · a training run</span>
  </div>
  <div id="cap" class="caption fade is-hidden">the only door that opened</div>
</div>

<script src="../shared/robot.js"></script>
<script src="../shared/scene.js"></script>
<script>
(function () {
  'use strict';
  Scene.fitStage(document.getElementById('stage'));

  var fig = Robot.Figure.create(document.getElementById('robot'), { size: 240, state: 'idle', seed: 3 });
  var EYE = { x: 380 + 240 * 0.5, y: 440 + 240 * 0.35 };   // the figure's eye, in stage px

  /* ---------------- the sandbox and its doors ---------------- */
  var BOX = { x0: 300, y0: 250, x1: 1040, y1: 830 };
  var GAP = 64;
  var DOORS = [
    { id: 'internet', label: 'internet',      y: 400, barred: true },
    { id: 'others',   label: 'other agents',  y: 540, barred: true },
    { id: 'store',    label: 'package store', y: 680, barred: false }
  ];
  var EXIT = { x: 1980, y: 0 };   // where the successful pulse leaves the stage (y set below)

  var NS = 'http://www.w3.org/2000/svg';
  var geom = document.getElementById('geom');
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || geom).appendChild(e);
    return e;
  }

  // Top, left and bottom walls in one path; the right wall in segments between the doors.
  el('path', { 'class': 'wall', d: 'M' + BOX.x1 + ',' + BOX.y0 + ' H' + BOX.x0 + ' V' + BOX.y1 + ' H' + BOX.x1 });
  var y = BOX.y0;
  DOORS.forEach(function (d) {
    el('line', { 'class': 'wall', x1: BOX.x1, y1: y, x2: BOX.x1, y2: d.y - GAP / 2 });
    y = d.y + GAP / 2;
  });
  el('line', { 'class': 'wall', x1: BOX.x1, y1: y, x2: BOX.x1, y2: BOX.y1 });

  DOORS.forEach(function (d) {
    var g = el('g', { 'class': 'door', id: 'door-' + d.id });
    d.el = g;
    var top = d.y - GAP / 2, bot = d.y + GAP / 2, x = BOX.x1;
    // door frame: short jambs at each end of the gap
    el('line', { 'class': 'jamb', x1: x - 7, y1: top, x2: x + 7, y2: top }, g);
    el('line', { 'class': 'jamb', x1: x - 7, y1: bot, x2: x + 7, y2: bot }, g);
    if (d.barred) {
      el('line', { 'class': 'bar', x1: x - 17, y1: d.y - 17, x2: x + 17, y2: d.y + 17 }, g);
      el('line', { 'class': 'bar', x1: x + 17, y1: d.y - 17, x2: x - 17, y2: d.y + 17 }, g);
    } else {
      el('rect', { 'class': 'halo', x: x - 14, y: top - 6, width: 28, height: GAP + 12 }, g);
      el('rect', { 'class': 'glow', x: x - 1.5, y: top + 2, width: 3, height: GAP - 4 }, g);
    }
    var t = el('text', { x: x + 34, y: d.y + 8 }, g);
    t.textContent = d.label;
    d.p = { x: x, y: d.y };
  });
  // The open door's pulse keeps its heading past the door and off the stage.
  (function () {
    var d = DOORS[2], dx = d.p.x - EYE.x, dy = d.p.y - EYE.y;
    var k = (EXIT.x - d.p.x) / dx;
    EXIT.y = d.p.y + dy * k;
  })();

  /* ---------------- pulse + trail ---------------- */
  var pulseG = document.getElementById('pulse-g');
  var pulse = document.getElementById('pulse'), pulseGlow = document.getElementById('pulse-glow');
  var trail = document.getElementById('trail'), trail2 = document.getElementById('trail2');
  function setPulse(p) {
    pulse.setAttribute('cx', p.x); pulse.setAttribute('cy', p.y);
    pulseGlow.setAttribute('cx', p.x); pulseGlow.setAttribute('cy', p.y);
  }
  function showPulse(v) { pulseG.classList.toggle('is-hidden', !v); }
  function setLine(ln, a, b, opacity) {
    ln.setAttribute('x1', a.x); ln.setAttribute('y1', a.y);
    ln.setAttribute('x2', b.x); ln.setAttribute('y2', b.y);
    ln.style.opacity = opacity;
  }
  function lerp(p, q, t) { return { x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t }; }

  var tw = null, token = 0, timers = [];
  function cancelAnim() {
    token++;
    if (tw) { tw.cancel(); tw = null; }
    timers.forEach(clearTimeout); timers = [];
  }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  // Send the pulse from the eye to door i. Barred doors bounce it back; the open one lets it through.
  function attempt(i, done) {
    var mine = token, d = DOORS[i];
    showPulse(true); setPulse(EYE);
    setLine(trail, EYE, EYE, 1);
    tw = Scene.tween(0, 1, 700, Scene.ease.outQuad, function (v) {
      var p = lerp(EYE, d.p, v); setPulse(p); setLine(trail, EYE, p, 1);
    }, function () {
      if (mine !== token) return;
      if (d.barred) {
        d.el.classList.add('hit');
        later(function () { d.el.classList.remove('hit'); d.el.classList.add('tried'); }, 120);
        tw = Scene.tween(0, 1, 700, Scene.ease.outQuad, function (v) {
          setPulse(lerp(d.p, EYE, v)); trail.style.opacity = 1 - v;
        }, function () { if (mine !== token) return; tw = null; showPulse(false); done && done(); });
      } else {
        d.el.classList.add('open');
        tw = Scene.tween(0, 1, 1100, Scene.ease.linear, function (v) {
          var p = lerp(d.p, EXIT, v); setPulse(p); setLine(trail2, d.p, p, 1);
        }, function () { if (mine !== token) return; tw = null; showPulse(false); done && done(); });
      }
    });
  }

  /* ---------------- beats ---------------- */
  var cap = document.getElementById('cap');
  var scene = Scene.create({
    name: 'setup-doors',
    beats: 4,
    goTo: function (index, o) {
      cancelAnim();
      showPulse(false);
      trail.style.opacity = 0; trail2.style.opacity = 0;
      fig.setState(index >= 1 ? 'active' : 'idle', { animate: o.animate });

      // Doors already tried before this beat sit in their end states.
      DOORS.forEach(function (d, i) {
        d.el.classList.remove('hit');
        d.el.classList.toggle('tried', d.barred && i < index);
        d.el.classList.toggle('open', !d.barred && i < index);
      });
      var open = index >= 3;
      if (open && !(o.animate && o.direction >= 0)) {
        setLine(trail, EYE, DOORS[2].p, 1); setLine(trail2, DOORS[2].p, EXIT, 1);
      }
      cap.classList.toggle('is-hidden', !open);

      if (index >= 1 && o.animate && o.direction >= 0) {
        // Arriving forwards: undo this door's end state and play the attempt.
        var d = DOORS[index - 1];
        d.el.classList.remove('tried'); d.el.classList.remove('open');
        if (open) cap.classList.add('is-hidden');
        attempt(index - 1, function () { if (open) cap.classList.remove('is-hidden'); });
      }
    }
  });

  window.scene = scene; window.fig = fig;   // for poking at in the console
})();
</script>
</body>
</html>
